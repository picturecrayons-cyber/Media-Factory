name: Merge Gate PostgreSQL 17 Verification

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/merge-gate-postgres17.yml"
      - "migrations/**"
      - "scripts/merge-gate-postgres17-assertions.sql"
      - "scripts/migrate.mjs"
      - "scripts/migration-plan.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-gate-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bridge_merge_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bridge_merge_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bridge_merge_gate
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/bridge_merge_gate
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/bridge_merge_gate
      PGSSLMODE: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Bootstrap Supabase-compatible roles
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d bridge_merge_gate -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END
          $$;
          SQL
      - name: Replay all repository migrations in disposable PostgreSQL 17
        run: npm run db:migrate
      - name: Verify Merge Gate schema, constraints, indexes, RLS and ACL
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d bridge_merge_gate -v ON_ERROR_STOP=1 -f scripts/merge-gate-postgres17-assertions.sql
      - name: Report rollback limitation explicitly
        if: always()
        run: |
          echo "::notice::This workflow verifies migration replay and the post-migration Merge Gate contract. It does not certify semantic merge rollback; no paired down migration is present in the candidate branch."
