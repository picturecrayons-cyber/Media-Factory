name: Testing migration ledger replay

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/staging-recovery/**"
      - "scripts/supabase-testing-ledger-replay.mjs"
      - ".github/workflows/testing-ledger-replay.yml"
  workflow_dispatch:

jobs:
  testing-ledger-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.80.0

      # The repository's active supabase/migrations directory is the canonical
      # Production source set. Hide it so the disposable stack starts empty;
      # the recovered Testing SQL is replayed only by the dedicated script.
      - name: Quarantine canonical Production migrations
        run: |
          test -d supabase/migrations
          test ! -e "$RUNNER_TEMP/bridge-production-ledger-migrations"
          mv supabase/migrations "$RUNNER_TEMP/bridge-production-ledger-migrations"
          mkdir -p supabase/migrations

      - name: Start disposable local Supabase PostgreSQL 17
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Restore canonical Production migration files
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/bridge-production-ledger-migrations" ]; then
            rm -rf supabase/migrations
            mv "$RUNNER_TEMP/bridge-production-ledger-migrations" supabase/migrations
          fi

      - name: Replay all 98 recovered Testing migrations
        run: node scripts/supabase-testing-ledger-replay.mjs
        env:
          TESTING_LEDGER_REPLAY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres

      - name: Stop disposable local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
