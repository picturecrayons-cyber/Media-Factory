name: Bridge Preview Certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - feat/bridge-production-rbac-services-20261127
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-preview-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, lint, unit tests and security scans
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # TanStack Start generates src/routeTree.gen.ts during the Vite build.
      # Build first so tsc sees the route tree for the exact checked-out source.
      - name: Generate routes and build
        run: npm run build

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit and regression tests
        run: npm test

      - name: Start app environment dev server
        # A dummy, unreachable local Postgres URL prevents PGLite migrations from
        # bootstrapping; this check only reads /__app-env and never opens a DB connection.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          npm run dev > /tmp/bridge-dev.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/__app-env > /tmp/bridge-app-env.json; then
              break
            fi
            sleep 2
          done
          if [ ! -s /tmp/bridge-app-env.json ]; then
            cat /tmp/bridge-dev.log
            exit 1
          fi

      - name: Authentication invariants
        run: npm run check:auth

      - name: Secret scan
        run: npm run secret-scan
