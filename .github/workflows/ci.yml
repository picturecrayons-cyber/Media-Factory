name: CI

on:
  push:
    branches: ["main", "feat/crayons-bridge-production", "fix/bridge-production-gate-20260923", "fix/bridge-final-production-gate-20260924"]
  pull_request:
    branches: ["main", "feature/title-asset-preview-gallery"]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Generate TanStack's route tree before checking route type literals.
      - run: npm run build
      - run: node scripts/check-vercel-output.mjs
      - run: npm run typecheck
      - run: npx eslint "src/lib/bridge/**/*.{ts,tsx}" "src/routes/**/*.{ts,tsx}" "src/components/bridge/**/*.{ts,tsx}" "src/components/ui/**/*.tsx"
      - run: npm test
      - run: node scripts/secret-scan.mjs
      - name: Forbid legacy dumps
        run: |
          test ! -e stream-vista.zip
          tracked="$(git ls-files | grep -E '(^|/)(stream-vista\.zip|legacy-dump\.json|django-dump\.json)$' || true)"
          if [ -n "$tracked" ]; then
            echo "Forbidden dump is tracked:"
            echo "$tracked"
            exit 1
          fi

  certification-gates-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workflow_test
          POSTGRES_PASSWORD: workflow_test
          POSTGRES_DB: bridge_certification_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workflow_test -d bridge_certification_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Bootstrap Supabase-compatible local test primitives
        env:
          DATABASE_URL: postgres://workflow_test:workflow_test@127.0.0.1:5432/bridge_certification_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $roles$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
          END
          $roles$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS 'SELECT NULL::uuid';
          SQL
      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://workflow_test:workflow_test@127.0.0.1:5432/bridge_certification_test
          PGSSLMODE: disable
      - name: Run rollback-only certification gate integration test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/tests/0018_bridge_certification_gates.test.sql
        env:
          DATABASE_URL: postgres://workflow_test:workflow_test@127.0.0.1:5432/bridge_certification_test

  workflow-postgres:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workflow_test
          POSTGRES_PASSWORD: workflow_test
          POSTGRES_DB: bridge_workflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workflow_test -d bridge_workflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:workflow
        env:
          BRIDGE_WORKFLOW_TEST_DATABASE_URL: postgres://workflow_test:workflow_test@127.0.0.1:5432/bridge_workflow_test
