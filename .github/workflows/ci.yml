name: CI

on:
  push:
    branches: ["main", "feat/crayons-bridge-production", "fix/bridge-production-gate-20260923", "fix/bridge-final-production-gate-20260924", "fix/canonical-supabase-url-resolution-20261024", "fix/signup-role-dashboards-rbac-20261024", "fix/workspace-studio-rbac-20261024"]
  pull_request:
    branches: ["main", "feat/creator-default-distribution-mandate-20261118", "fix/canonical-supabase-url-resolution-20261024", "fix/signup-role-dashboards-rbac-20261024", "fix/workspace-studio-rbac-20261024"]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Generate TanStack's route tree before checking route type literals.
      - run: npm run build
      - run: node scripts/check-vercel-output.mjs
      - run: npm run typecheck
      - run: npx eslint "src/lib/bridge/**/*.{ts,tsx}" "src/routes/**/*.{ts,tsx}" "src/components/bridge/**/*.{ts,tsx}" "src/components/ui/**/*.tsx"
      - run: npm test
      - run: node scripts/secret-scan.mjs
      - name: Forbid legacy dumps
        run: |
          test ! -e stream-vista.zip
          tracked="$(git ls-files | grep -E '(^|/)(stream-vista\.zip|legacy-dump\.json|django-dump\.json)$' || true)"
          if [ -n "$tracked" ]; then
            echo "Forbidden dump is tracked:"
            echo "$tracked"
            exit 1
          fi

  workflow-postgres:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workflow_test
          POSTGRES_PASSWORD: workflow_test
          POSTGRES_DB: bridge_workflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workflow_test -d bridge_workflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:workflow
        env:
          BRIDGE_WORKFLOW_TEST_DATABASE_URL: postgres://workflow_test:workflow_test@127.0.0.1:5432/bridge_workflow_test

  supabase-migration-replay:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Supabase CLI automatically applies files in supabase/migrations during
      # start. Hide the recovered ledger temporarily so the custom replay can
      # inject its verified local-only fixtures before applying each migration.
      - name: Quarantine recovered migrations before starting local Supabase
        run: |
          test -d supabase/migrations
          test ! -e "$RUNNER_TEMP/bridge-production-ledger-migrations"
          mv supabase/migrations "$RUNNER_TEMP/bridge-production-ledger-migrations"
          mkdir -p supabase/migrations

      - name: Start an isolated local Supabase stack without auto-applying the ledger
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Restore recovered migrations for controlled replay
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/bridge-production-ledger-migrations" ]; then
            rm -rf supabase/migrations
            mv "$RUNNER_TEMP/bridge-production-ledger-migrations" supabase/migrations
          fi

      - name: Replay all recovered Production-ledger migrations
        run: node scripts/supabase-migration-replay.mjs
        env:
          SUPABASE_REPLAY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
