name: Bridge STAGING OCI Storage E2E

on:
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: "Confirm CRA-128 isolation is proven and only the approved STAGING DB and isolated test bucket may be mutated."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bridge-staging-oci-e2e
  cancel-in-progress: false

jobs:
  storage-e2e:
    if: ${{ inputs.confirm_staging_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run explicitly approved STAGING OCI → Bridge persistence round-trip
        env:
          BRIDGE_E2E_ENVIRONMENT: staging
          BRIDGE_E2E_ALLOW_DB_MUTATION: ${{ inputs.confirm_staging_only && 'YES' || 'NO' }}
          BRIDGE_E2E_ALLOW_OCI_MUTATION: ${{ inputs.confirm_staging_only && 'YES' || 'NO' }}
          BRIDGE_E2E_EXPECTED_SUPABASE_REF: jbymleftneggcgutlcqu
          OCI_TENANCY_OCID: ${{ secrets.STAGING_OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.STAGING_OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.STAGING_OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.STAGING_OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.STAGING_OCI_REGION }}
          OCI_NAMESPACE: ${{ secrets.STAGING_OCI_NAMESPACE }}
          OCI_BUCKET_NAME: ${{ secrets.STAGING_OCI_BUCKET_NAME }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          BRIDGE_E2E_ASSET_ID: ${{ secrets.STAGING_BRIDGE_E2E_ASSET_ID }}
          BRIDGE_E2E_TITLE_ID: ${{ secrets.STAGING_BRIDGE_E2E_TITLE_ID }}
        run: node scripts/oci-storage-e2e.mjs
