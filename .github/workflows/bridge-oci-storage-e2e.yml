name: Bridge OCI Storage E2E

on:
  workflow_dispatch:
    inputs:
      confirm_nonproduction:
        description: "Run only against the dedicated non-production OCI environment"
        required: true
        type: choice
        options:
          - NO
          - I_CONFIRM_NON_PRODUCTION
        default: NO

permissions:
  contents: read

jobs:
  storage-e2e:
    if: ${{ inputs.confirm_nonproduction == 'I_CONFIRM_NON_PRODUCTION' }}
    environment: bridge-oci-e2e-nonproduction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run isolated OCI object round-trip (no database writes)
        env:
          OCI_TENANCY_OCID: ${{ secrets.BRIDGE_E2E_OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.BRIDGE_E2E_OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.BRIDGE_E2E_OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.BRIDGE_E2E_OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.BRIDGE_E2E_OCI_REGION }}
          OCI_NAMESPACE: ${{ secrets.BRIDGE_E2E_OCI_NAMESPACE }}
          OCI_BUCKET_NAME: ${{ secrets.BRIDGE_E2E_OCI_BUCKET_NAME }}
        run: node scripts/oci-storage-e2e.mjs
