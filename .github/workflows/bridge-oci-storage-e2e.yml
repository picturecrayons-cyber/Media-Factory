name: Bridge OCI Storage E2E

on:
  workflow_dispatch:

jobs:
  storage-e2e:
    # This environment must contain only STAGING database/OCI credentials and
    # require reviewer approval before a write-capable round-trip is run.
    environment: bridge-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run STAGING-only OCI → Bridge persistence round-trip
        env:
          BRIDGE_E2E_TARGET: staging
          BRIDGE_E2E_EXPECTED_PROJECT_REF: jbymleftneggcgutlcqu
          OCI_TENANCY_OCID: ${{ secrets.STAGING_OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.STAGING_OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.STAGING_OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.STAGING_OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.STAGING_OCI_REGION }}
          OCI_NAMESPACE: ${{ secrets.STAGING_OCI_NAMESPACE }}
          OCI_BUCKET_NAME: ${{ secrets.STAGING_OCI_BUCKET_NAME }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          BRIDGE_E2E_ASSET_ID: ${{ secrets.STAGING_BRIDGE_E2E_ASSET_ID }}
        run: node scripts/oci-storage-e2e.mjs
