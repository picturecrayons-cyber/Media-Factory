name: Bridge OCI Storage E2E

on:
  # Manual-only: the fixture is intentionally single-use and must be refreshed before each run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-e2e:
    runs-on: ubuntu-26.04
    environment: bridge-preview-storage
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify preview-only configuration is present
        env:
          OCI_TENANCY_OCID: ${{ secrets.BRIDGE_E2E_OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.BRIDGE_E2E_OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.BRIDGE_E2E_OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.BRIDGE_E2E_OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.BRIDGE_E2E_OCI_REGION }}
          OCI_NAMESPACE: ${{ secrets.BRIDGE_E2E_OCI_NAMESPACE }}
          OCI_BUCKET_NAME: ${{ secrets.BRIDGE_E2E_OCI_BUCKET_NAME }}
          DATABASE_URL: ${{ secrets.BRIDGE_PREVIEW_DATABASE_URL }}
          BRIDGE_E2E_ASSET_ID: ${{ secrets.BRIDGE_E2E_ASSET_ID }}
        run: |
          set -eu
          for name in OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_REGION OCI_NAMESPACE OCI_BUCKET_NAME DATABASE_URL BRIDGE_E2E_ASSET_ID; do
            eval "value=\${$name-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required bridge-preview-storage environment secret for $name"
              exit 2
            fi
          done
          echo "Preview-only secret presence verified; values are not printed."
      - name: Run non-production OCI → Bridge persistence round-trip
        env:
          OCI_TENANCY_OCID: ${{ secrets.BRIDGE_E2E_OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.BRIDGE_E2E_OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.BRIDGE_E2E_OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.BRIDGE_E2E_OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.BRIDGE_E2E_OCI_REGION }}
          OCI_NAMESPACE: ${{ secrets.BRIDGE_E2E_OCI_NAMESPACE }}
          OCI_BUCKET_NAME: ${{ secrets.BRIDGE_E2E_OCI_BUCKET_NAME }}
          DATABASE_URL: ${{ secrets.BRIDGE_PREVIEW_DATABASE_URL }}
          BRIDGE_E2E_ASSET_ID: ${{ secrets.BRIDGE_E2E_ASSET_ID }}
        run: node scripts/oci-storage-e2e.mjs
