name: Manual Loop delivery safety
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  delivery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ephemeral delivery and approval tests (no external services)
        run: node --experimental-strip-types --test src/lib/bridge/loop-manual-delivery.test.ts src/lib/bridge/publication-contract.test.ts
      - name: Existing workflow regression tests
        run: npm run test:workflow
