name: Bridge Supervisor Workflow Validation

on:
  push:
    branches:
      - ops/github-supervisor-monitoring-20261103
    paths:
      - ".github/workflows/bridge-github-supervisor.yml"
      - ".github/workflows/bridge-safe-ci-recovery.yml"
      - ".github/workflows/bridge-supervisor-validation.yml"
      - "scripts/bridge-github-supervisor.test.mjs"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/bridge-github-supervisor.yml"
      - ".github/workflows/bridge-safe-ci-recovery.yml"
      - ".github/workflows/bridge-supervisor-validation.yml"
      - "scripts/bridge-github-supervisor.test.mjs"

permissions:
  contents: read

concurrency:
  group: bridge-supervisor-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Test supervisor and recovery safety contracts
        run: node --test scripts/bridge-github-supervisor.test.mjs
