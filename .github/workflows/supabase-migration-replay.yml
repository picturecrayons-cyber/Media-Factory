name: Supabase Production-ledger Migration Replay

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "scripts/supabase-migration-replay.mjs"
      - ".github/workflows/supabase-migration-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start an isolated local Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Replay all recovered Production-ledger migrations
        run: node scripts/supabase-migration-replay.mjs
        env:
          SUPABASE_REPLAY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
