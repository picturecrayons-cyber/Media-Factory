name: Scope A PostgreSQL Onboarding Verification

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/scope-a-postgres.yml"
      - "migrations/**"
      - "src/lib/bridge/**"
      - "src/lib/db.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  scope-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Use the public AWS ECR mirror to avoid Docker Hub anonymous pull-rate limits.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bridge_scope_a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bridge_scope_a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/bridge_scope_a
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/bridge_scope_a
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bridge_scope_a
      PGSSLMODE: disable
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Bootstrap Supabase-compatible roles
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d bridge_scope_a -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END
          $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY
          );
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $fn$ SELECT NULL::uuid $fn$;
          SQL

      - name: Replay repository migrations into disposable PostgreSQL
        run: npm run db:migrate

      - name: Run onboarding static regression tests
        run: node --experimental-strip-types --test src/lib/bridge/onboarding-atomicity.test.ts

      - name: Run real onboarding DB assertions
        run: node scripts/scope-a-onboarding-db.mjs
