name: Scope A PostgreSQL Onboarding Verification

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/scope-a-postgres.yml"
      - "migrations/**"
      - "supabase/migrations/20261006230000_duplicate_title_reconciliation.sql"
      - "scripts/merge-gate-postgres17-*"
      - "src/lib/bridge/**"
      - "src/lib/db.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  scope-a:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bridge_scope_a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bridge_scope_a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/bridge_scope_a
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/bridge_scope_a
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bridge_scope_a
      PGSSLMODE: disable
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Bootstrap Supabase-compatible roles and auth fixture
        run: |
          psql -d bridge_scope_a -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END
          $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid LANGUAGE sql STABLE AS $fn$ SELECT NULL::uuid $fn$;
          SQL

      - name: Bootstrap canonical title schema for duplicate-review source migration
        run: psql -d bridge_scope_a -v ON_ERROR_STOP=1 -f migrations/0004_bridge.sql

      - name: Replay canonical duplicate-review source migration
        run: psql -d bridge_scope_a -v ON_ERROR_STOP=1 -f supabase/migrations/20261006230000_duplicate_title_reconciliation.sql

      - name: Replay archived review security hardening in disposable fixture
        run: |
          psql -d bridge_scope_a -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE public.bridge_title_duplicate_reviews ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.bridge_title_reconciliation_snapshots ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.bridge_title_reconciliation_events ENABLE ROW LEVEL SECURITY;
          REVOKE ALL ON FUNCTION public.bridge_duplicate_title_loop_release_allowed(text) FROM PUBLIC;
          REVOKE ALL ON FUNCTION public.bridge_duplicate_title_loop_release_allowed(text) FROM anon, authenticated;
          SQL

      - name: Replay repository migrations into disposable PostgreSQL 17
        run: npm run db:migrate

      - name: Run onboarding static regression tests
        run: node --experimental-strip-types --test src/lib/bridge/onboarding-atomicity.test.ts

      - name: Run real onboarding DB assertions
        run: node scripts/scope-a-onboarding-db.mjs

      - name: Verify all nine Merge Gate assertions and security controls
        run: psql -d bridge_scope_a -X -v ON_ERROR_STOP=1 -f scripts/merge-gate-postgres17-assertions.sql

      - name: Run nine negative contract tests against isolated database clones
        run: bash scripts/merge-gate-postgres17-negative-tests.sh

      - name: Report rollback limitation explicitly
        if: always()
        run: |
          echo "::notice::This job verifies schema and negative contract detection. It does not certify semantic merge rollback; no paired down migration is present in this candidate."
