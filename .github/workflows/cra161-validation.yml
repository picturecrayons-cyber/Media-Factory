name: CRA-161 validation

on:
  push:
    branches:
      - feat/secure-deliveries-pipeline-cra161-20261103
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cra161-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
